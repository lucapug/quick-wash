# Gate proxy della factory agentica — allowlist egress, fail-closed.
# L'agente sta su rete internal: senza questo proxy NON ha route verso l'esterno.
# Aggiungere qui un dominio = l'unica via per aprire nuovo egress.

http_port 3128
dns_v4_first on

# niente cache; log sui file interni del container (docker exec <gate> tail /var/log/squid/access.log)
cache deny all

# --- ACL: cosa è consentito ---

# Strata (serving LLM sul tailnet) — solo HTTP sulla 8080
acl strata_host dstdomain minisforum-nucx-windows.tail60fef8.ts.net
acl strata_port port 8080

# Reviewer indipendente (llama.cpp GLM-4.7-Flash) — HTTP sulla 8081, stesso host.
# Il reviewer lavora solo nelle finestre (llama-server su a Strata scaricato):
# fuori finestra la porta risponde refused e il workflow cade sul fallback pi.
acl reviewer_port port 8081

# GitHub: git push/pull, gh CLI, release asset (incl. la CDN moderna dei binary)
acl gh_domains dstdomain github.com api.github.com codeload.github.com objects.githubusercontent.com raw.githubusercontent.com github-releases.githubusercontent.com release-assets.githubusercontent.com .actions.githubusercontent.com

# storage log/artifact di GitHub Actions: account Azure "production*" (regex mirata,
# non tutto .blob.core.windows.net che è storage pubblico di chiunque)
acl gh_storage dstdom_regex -i ^production[a-z0-9]+\.blob\.core\.windows\.net$

# Registry pacchetti (task di coding: npm/pnpm e pip)
acl pkg_domains dstdomain registry.npmjs.org pypi.org files.pythonhosted.org

# VS Code server: serve al PRIMO attach del devcontainer (rimuovere per massima durezza)
acl vscode_domains dstdomain update.code.visualstudio.com vscode.download.prss.microsoft.com marketplace.visualstudio.com visualstudio.gallerycdn.azureedge.net

# Prime Agent (PrimeIntellect): installer/aggiornamenti + astral.sh (uv, kernel Python).
# NOTA: il bucket R2 è CDN condivisa — consentito SOLO il subdomain esatto del progetto.
acl prime_domains dstdomain .primeintellect.ai pub-728493de92a943e2a9b2d17b4719f318.r2.dev .astral.sh

# OpenCode: `opencode run` carica il catalogo del provider da
# https://models.opencode.ai/api.json e lo usa come baseUrl, IGNORANDO la baseUrl
# dichiarata in opencode.json — senza questa entrada il probe fallisce con 403 e
# il valore registrato nel config letterale non viene mai provato davvero.
# Approvazione 5/11/2026 (fastlane-log di factory-infra): la classe del cambio
# vale per il lab e per il template insieme.
acl opencode_domains dstdomain models.opencode.ai

acl tls_ports port 443

# --- Regole: allow espliciti, deny tutto il resto ---
http_access allow strata_host strata_port
http_access allow strata_host reviewer_port
http_access allow gh_domains tls_ports
http_access allow gh_storage tls_ports
http_access allow pkg_domains tls_ports
http_access allow vscode_domains tls_ports
http_access allow prime_domains tls_ports
http_access allow opencode_domains tls_ports
http_access deny all
